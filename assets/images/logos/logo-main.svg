<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 68" width="320" height="68" fill="none">
  <!-- Emblem Icon: Stylized Geometric Tower & PK Monogram -->
  <g transform="translate(6, 4)">
    <!-- Background Architectural Shadow Shield -->
    <polygon points="26,0 30,0 31,14 25,14" fill="#f4c03b" />
    <polygon points="23,14 33,14 33,60 23,60" fill="#243344" />
    
    <!-- Left Tower (P-structure) -->
    <polygon points="3,20 20,12 20,60 12,60 12,36 3,36" fill="#243344" />
    <polygon points="3,36 12,36 12,60 3,60" fill="#f4c03b" />
    <polygon points="3,20 20,12 20,34 3,34" fill="#f4c03b" />
    <polygon points="7,23 16,19 16,30 7,30" fill="#ffffff" />
    
    <!-- Center Tower Windows -->
    <rect x="26" y="19" width="4" height="4" fill="#ffffff" />
    <rect x="26" y="27" width="4" height="4" fill="#ffffff" />
    <rect x="26" y="35" width="4" height="4" fill="#ffffff" />
    <rect x="26" y="43" width="4" height="4" fill="#f4c03b" />

    <!-- Right Tower / Diagonal Struts (K-structure) -->
    <polygon points="36,15 55,30 46,38 36,30" fill="#f4c03b" />
    <polygon points="36,28 47,38 57,60 46,60 36,44" fill="#243344" />
    <polygon points="46,47 57,60 47,60" fill="#f4c03b" />
    <line x1="1" y1="60" x2="59" y2="60" stroke="#f4c03b" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <g transform="translate(76, 0)">
    <!-- PK's -->
    <text x="0" y="36" font-family="'Roboto', 'Montserrat', -apple-system, sans-serif" font-size="34" font-weight="900" fill="#243344" letter-spacing="1">PK’S</text>
    <!-- CONSTRUCTION -->
    <text x="1" y="55" font-family="'Roboto', 'Montserrat', -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#243344" letter-spacing="4.5">CONSTRUCTION</text>
    <!-- Accent Line -->
    <line x1="1" y1="60" x2="65" y2="60" stroke="#f4c03b" stroke-width="2" />
  </g>
</svg>
